name: tests

# Runs the unit tests only. Nothing is built or published from here: no tag
# trigger (a branch filter makes tag pushes skip it), no secrets, read-only
# token.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # The suite uses synthetic tensors only; fail fast if anything tries to
      # reach the Hugging Face Hub.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install the CPU build of torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install spectral-trust and pytest
        run: |
          python -m pip install -e .
          python -m pip install pytest

      - name: Run the tests
        run: python -m pytest -q
