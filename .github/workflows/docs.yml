name: docs

# Builds the documentation on every pull request, and deploys it to GitHub
# Pages from main only. Pages must be enabled in the repository settings
# (Settings > Pages > Source: GitHub Actions). No secrets: deployment uses
# the workflow's OIDC token.
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py

      # mkdocstrings reads the sources statically, so the package and torch
      # are not installed; these are the requirements of the [docs] extra.
      - name: Install mkdocs-material and mkdocstrings
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mkdocs>=1.6" "mkdocs-material>=9.5" "mkdocstrings[python]>=0.26"

      - name: Build the site
        run: mkdocs build --strict

      - name: Upload the site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
